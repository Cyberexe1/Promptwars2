AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SmogWise deployment identity. Creates an IAM role that GitHub Actions assumes
  through OpenID Connect, so CI never needs long-lived AWS access keys.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository.
    Default: Cyberexe1

  GitHubRepo:
    Type: String
    Description: Repository name.
    Default: Promptwars2

  GitHubBranch:
    Type: String
    Description: Branch allowed to deploy. Other branches can run tests but not deploy.
    Default: main

  CreateOidcProvider:
    Type: String
    Description: >
      Set to false if this AWS account already has the GitHub OIDC provider.
      An account can only hold one provider per URL.
    AllowedValues: ['true', 'false']
    Default: 'true'

  FrontendBucketName:
    Type: String
    Description: Name of the S3 bucket holding the built frontend.

  EcrRepositoryName:
    Type: String
    Default: smogwise-api

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates the GitHub OIDC endpoint's certificate chain against its
      # own trust store, so a pinned thumbprint is no longer required.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-deploy'
      Description: Assumed by GitHub Actions to deploy SmogWise.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Restricted to one branch of one repository. Without this
              # condition any GitHub repository could assume the role.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: PushContainerImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'

        - PolicyName: DeployBackendService
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - apprunner:StartDeployment
                  - apprunner:DescribeService
                  - apprunner:ListServices
                  - apprunner:ListOperations
                Resource: '*'

        - PolicyName: PublishFrontend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${FrontendBucketName}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${FrontendBucketName}/*'
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:ListDistributions
                Resource: '*'

Outputs:
  DeploymentRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repository variable in GitHub.
    Value: !GetAtt DeploymentRole.Arn
