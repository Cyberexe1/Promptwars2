AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SmogWise frontend delivery. A private S3 bucket holds the built React app and
  CloudFront serves it over HTTPS. The bucket is never public: CloudFront reaches
  it through Origin Access Control.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique bucket name, for example smogwise-web-123456789012.

  DomainName:
    Type: String
    Description: Optional custom domain. Requires CertificateArn.
    Default: ''

  CertificateArn:
    Type: String
    Description: ACM certificate ARN. Must be issued in us-east-1 for CloudFront.
    Default: ''

  PriceClass:
    Type: String
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Default: PriceClass_100

  ApiOrigin:
    Type: String
    Description: >-
      The App Runner origin, as https://xxxx.awsapprunner.com. Serves two
      purposes: it becomes a second CloudFront origin so /api/* is proxied
      through this distribution, which keeps the page and the API same-site so
      the session cookie works, and it is added to the Content-Security-Policy
      connect-src list for anything still calling the API directly. Leave
      empty on the first deployment, then redeploy with the real value once
      App Runner exists.
    Default: ''

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  HasApiOrigin: !Not [!Equals [!Ref ApiOrigin, '']]

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      # No public access of any kind. CloudFront is the only reader.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        # Lets a bad deployment be rolled back to the previous object version.
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                # Scoped to this distribution, so another account's
                # distribution cannot read the bucket.
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Signs CloudFront requests to the private S3 origin.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            # Must be a single-line string. A YAML folded block adds a
            # trailing newline, which CloudFront rejects as an illegal
            # character.
            #
            # connect-src is restricted to the API origin passed in at deploy
            # time, so the page can only call its own backend.
            #
            # style-src is split rather than carrying a blanket
            # 'unsafe-inline'. React's style props need inline style
            # attributes, which style-src-attr allows; injected <style>
            # elements are a different thing and style-src-elem blocks them.
            # That closes CSS-based exfiltration through attribute selectors
            # and background: url(), and overlay-based UI spoofing, without
            # breaking the components.
            ContentSecurityPolicy: !Sub "default-src 'self'; img-src 'self' data:; style-src-elem 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; connect-src 'self' ${ApiOrigin}; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          # X-XSS-Protection is deliberately not set. The header is deprecated,
          # ignored by every current browser, and its filter has itself been an
          # information-disclosure vector. The CSP above is what blocks script
          # injection.

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SmogWise frontend
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              # Empty when using OAC rather than the legacy OAI.
              OriginAccessIdentity: ''
          - !If
            - HasApiOrigin
            - Id: ApiOrigin
              # Host only: the origin domain cannot carry a scheme or a path.
              DomainName: !Select [1, !Split ['://', !Ref ApiOrigin]]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                OriginReadTimeout: 30
            - !Ref AWS::NoValue

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized. Safe as the default because every asset
          # filename is content-hashed by the Vite build.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

        CacheBehaviors:
          # The API, served through this distribution so that the browser sees
          # one site.
          #
          # Without this the page is on *.cloudfront.net and the API on
          # *.awsapprunner.com, which are different sites, so a browser will
          # not attach the SameSite=Lax session cookie to the page's fetch and
          # a signed-in user appears signed out. The curl-based live smoke
          # tests cannot catch it, because curl ignores SameSite.
          #
          # Routed here rather than relaxing the cookie to SameSite=None,
          # which would throw away a real cross-site request forgery defence
          # to work around a deployment topology.
          - !If
            - HasApiOrigin
            - PathPattern: /api/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              # Managed-CachingDisabled: every response here is per-user.
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              # Managed-AllViewerExceptHostHeader. Forwards cookies, headers
              # and query strings, but keeps the origin's own Host so App
              # Runner routes the request. Forwarding the CloudFront host
              # would make App Runner reject it.
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              # Deliberately not SecurityHeadersPolicy: that policy sets a CSP
              # for an HTML document, and these are JSON API responses. The
              # API sets its own headers through helmet.
            - !Ref AWS::NoValue
          - PathPattern: /health
            TargetOriginId: !If [HasApiOrigin, ApiOrigin, S3Origin]
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /index.html
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingDisabled. The entry point must never be cached,
            # or users keep loading an old bundle after a deployment.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

        # No CustomErrorResponses, deliberately.
        #
        # They used to map 403 and 404 to /index.html with a 200, which worked
        # while S3 was the only origin: a client-side route such as /dashboard
        # is not an object, S3 answered 403, and the app shell was served
        # instead.
        #
        # That broke the moment the API joined this distribution, because
        # custom error responses apply to every behaviour and cannot be scoped
        # to one. Verified against the live stack: a POST with no CSRF token
        # returned 403 directly from App Runner and 200 carrying HTML through
        # CloudFront. The backend still refused the request, so nothing
        # unauthorised happened, but the browser was told the call succeeded
        # and then had HTML to parse as JSON.
        #
        # Client-side routes are handled instead by publishing a copy of
        # index.html at each route path, which `deploy.ps1` does from one list.
        # The cost is that a path nobody published, such as a typo, returns the
        # S3 error rather than the app's own not-found page.
        #
        # The better fix is a CloudFront Function on viewer-request that
        # rewrites extensionless, non-/api paths to /index.html. It was written
        # and reverted because the deploying identity has no
        # cloudfront:CreateFunction permission. See infrastructure/README.md.

Outputs:
  BucketName:
    Description: Deployment target for the built frontend.
    Value: !Ref WebBucket

  DistributionId:
    Description: Needed to invalidate the cache after a deployment.
    Value: !Ref Distribution

  SiteUrl:
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'

  CorsOriginForBackend:
    Description: Set this as CorsAllowedOrigins in 04-backend.yaml.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
