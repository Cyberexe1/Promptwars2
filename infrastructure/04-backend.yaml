AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SmogWise API on AWS App Runner, with a least-privilege instance role and
  CloudWatch alarms. Requires an image already present in ECR, so deploy this
  after 02-ecr.yaml and the first image push.

Parameters:
  EcrRepositoryName:
    Type: String
    Default: smogwise-api

  ImageTag:
    Type: String
    Default: latest

  DynamoDbTableName:
    Type: String
    Description: Table from 03-data.yaml.
    Default: smogwise

  BedrockModelId:
    Type: String
    Description: >
      Inference profile or model id, for example
      eu.anthropic.claude-sonnet-4-5-20250929-v1:0. Leave empty to run on the
      deterministic rules engine only.
    Default: ''

  CorsAllowedOrigins:
    Type: String
    Description: >
      The CloudFront domain of the frontend, as https://xxxx.cloudfront.net.
      Comma-separate multiple origins. Must not be '*'.
    Default: http://localhost:5173

  RoleBoundaryPolicyName:
    Type: String
    Description: >
      Name of the permissions-boundary policy applied to the roles this stack
      creates. Caps what those roles can ever do, so a wide inline policy on
      them grants nothing extra. Create it from
      infrastructure/role-boundary-policy.json first. Leave empty only if the
      deploying identity is not restricted by deploy-policy.json, which
      requires this boundary on CreateRole.
    Default: smogwise-role-boundary

  Cpu:
    Type: String
    AllowedValues: ['0.25 vCPU', '0.5 vCPU', '1 vCPU', '2 vCPU', '4 vCPU']
    Default: '0.25 vCPU'

  Memory:
    Type: String
    AllowedValues: ['0.5 GB', '1 GB', '2 GB', '3 GB', '4 GB']
    Default: '0.5 GB'

  MaxConcurrency:
    Type: Number
    Description: Requests per instance before App Runner scales out.
    Default: 50
    MinValue: 1
    MaxValue: 200

  MinSize:
    Type: Number
    Description: >
      Provisioned instances. 1 avoids cold starts; App Runner bills for
      provisioned capacity even when idle.
    Default: 1
    MinValue: 1

  MaxSize:
    Type: Number
    Default: 3
    MinValue: 1

  AlarmEmail:
    Type: String
    Description: Optional address for alarm notifications. Leave empty to skip.
    Default: ''

Conditions:
  HasBedrockModel: !Not [!Equals [!Ref BedrockModelId, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasRoleBoundary: !Not [!Equals [!Ref RoleBoundaryPolicyName, '']]

Resources:
  # -------------------------------------------------------------------------
  # Secrets
  # -------------------------------------------------------------------------

  # HMAC key for session cookies. Generated by CloudFormation so the value
  # never passes through a template parameter, a shell history, or a CI log.
  # Anyone holding this key can forge a session for any account.
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}/session-secret'
      Description: Signing key for SmogWise session cookies.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # -------------------------------------------------------------------------
  # Roles
  # -------------------------------------------------------------------------

  # Lets App Runner pull the image. Separate from the instance role so the
  # running container has no registry access of its own.
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If
        - HasRoleBoundary
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${RoleBoundaryPolicyName}'
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess'

  # The identity the application itself runs as. Scoped to exactly the actions
  # the code performs, on exactly the resources it touches.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If
        - HasRoleBoundary
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${RoleBoundaryPolicyName}'
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDbAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # The code issues GetCommand and PutCommand and nothing
                  # else. UpdateItem, DeleteItem and Query were granted and
                  # never used, which meant a compromised container could
                  # delete every account record rather than only read one.
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDbTableName}'
              # Deliberately absent: Scan, Query, UpdateItem, DeleteItem,
              # DeleteTable, and any table-level administration. Index access
              # is gone too, because no secondary index is queried.

        - PolicyName: ReadSessionSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Scoped to this one secret, not to Secrets Manager at large.
                Resource: !Ref SessionSecret

        - !If
          - HasBedrockModel
          - PolicyName: BedrockInvoke
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  # Converse maps onto InvokeModel. Streaming is not used.
                  Action: bedrock:InvokeModel
                  # Scoped to the one configured model. A wildcard here handed
                  # a compromised container a billable inference endpoint for
                  # every model enabled in the account.
                  #
                  # The inference-profile entry is prefix-wildcarded because a
                  # cross-region profile id carries a region prefix, as in
                  # us.amazon.nova-pro-v1:0. If an AccessDeniedException on
                  # InvokeModel appears after a model change, this pair is the
                  # first thing to check.
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*${BedrockModelId}'
          - !Ref AWS::NoValue

  # -------------------------------------------------------------------------
  # Service
  # -------------------------------------------------------------------------

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-api'
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        # Redeploys automatically when a new image lands on the watched tag.
        AutoDeploymentsEnabled: true
        ImageRepository:
          ImageIdentifier: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}:${ImageTag}'
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '3000'
            RuntimeEnvironmentVariables:
              - Name: NODE_ENV
                Value: production
              - Name: PORT
                Value: '3000'
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: CORS_ALLOWED_ORIGINS
                Value: !Ref CorsAllowedOrigins
              - Name: BEDROCK_MODEL_ID
                Value: !Ref BedrockModelId
              - Name: DYNAMODB_TABLE_NAME
                Value: !Ref DynamoDbTableName
            # App Runner resolves these from Secrets Manager at start-up, so
            # the value never appears in the task definition or the console.
            # The air-quality provider still needs no API key; this is the
            # only secret the deployment holds.
            RuntimeEnvironmentSecrets:
              - Name: SESSION_SECRET
                Value: !Ref SessionSecret
      AutoScalingConfigurationArn: !GetAtt AutoScalingConfiguration.AutoScalingConfigurationArn
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        EgressConfiguration:
          # Public egress so the service can reach Open-Meteo and Bedrock.
          EgressType: DEFAULT
        IngressConfiguration:
          IsPubliclyAccessible: true
      Tags:
        - Key: Application
          Value: SmogWise

  AutoScalingConfiguration:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub '${AWS::StackName}-scaling'
      MaxConcurrency: !Ref MaxConcurrency
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize

  # -------------------------------------------------------------------------
  # Monitoring
  # -------------------------------------------------------------------------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      DisplayName: SmogWise alarms
      Subscription:
        - Endpoint: !Ref AlarmEmail
          Protocol: email

  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-5xx'
      AlarmDescription: >
        The API is returning server errors. Note that rejected CORS origins and
        oversized bodies return 4xx by design, so this should stay quiet.
      Namespace: AWS/AppRunner
      MetricName: 5xxStatusResponses
      Dimensions:
        # ServiceName is a property, not a GetAtt attribute, so the same
        # expression used to name the service is repeated here.
        - Name: ServiceName
          Value: !Sub '${AWS::StackName}-api'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-latency'
      AlarmDescription: >
        Request latency is high. Most likely an upstream slowdown at Open-Meteo
        or Bedrock; both have client-side timeouts, so this should self-clear.
      Namespace: AWS/AppRunner
      MetricName: RequestLatency
      Dimensions:
        - Name: ServiceName
          Value: !Sub '${AWS::StackName}-api'
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

Outputs:
  SessionSecretArn:
    Description: >
      Rotating this secret signs out every user, because existing cookies no
      longer verify. That is also the emergency control if it ever leaks.
    Value: !Ref SessionSecret

  ServiceUrl:
    Description: Use this as VITE_API_URL when building the frontend.
    Value: !Sub 'https://${Service.ServiceUrl}'

  ServiceArn:
    Value: !GetAtt Service.ServiceArn

  HealthCheckUrl:
    Value: !Sub 'https://${Service.ServiceUrl}/health'

  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
