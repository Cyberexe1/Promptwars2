name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the newest run per ref needs to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install cfn-lint

      - name: Validate CloudFormation templates
        run: cfn-lint

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: smogwise-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves /health
        run: |
          docker run -d --name api -p 3000:3000 smogwise-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "Health check passed"
              curl -s http://localhost:3000/health
              docker rm -f api
              exit 0
            fi
            sleep 1
          done
          echo "Health check never passed. Container logs:"
          docker logs api
          docker rm -f api
          exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Fails on high and critical advisories. Moderate and below are
      # reported without blocking, so a transitive dev-only advisory cannot
      # stop a deployment on its own.
      - name: Audit ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high

      - name: Report all advisories for visibility
        if: always()
        working-directory: ${{ matrix.project }}
        run: npm audit || true

  image-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: smogwise-api:scan
          cache-from: type=gha

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: smogwise-api:scan
          format: table
          severity: HIGH,CRITICAL
          # Fail the build on a fixable high or critical finding. Issues with
          # no available fix are reported but do not block, since there is
          # nothing actionable to do about them.
          ignore-unfixed: true
          exit-code: '1'
