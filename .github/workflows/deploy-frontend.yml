name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm a push to production.
        required: true
        type: string

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the confirmation input
        if: inputs.confirm != 'deploy'
        run: |
          echo "Deployment not confirmed. Re-run and type 'deploy'."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, check, and build
        working-directory: frontend
        env:
          # A slash, so every call is same-origin. CloudFront proxies /api/* to
          # App Runner, which keeps the page and the API one site: the session
          # and CSRF cookies are SameSite=Lax, and a browser withholds them
          # from a cross-site request, which makes sign-up fail with a 403.
          #
          # Deliberately not taken from a repository variable. This used to be
          # vars.VITE_API_URL, which holds the App Runner address, and running
          # this workflow would have shipped a bundle that calls it directly
          # and silently broken sign-in again.
          VITE_API_URL: /
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Fail if the bundle calls a backend directly
        working-directory: frontend
        run: |
          if grep -rq "localhost:3000" dist/assets; then
            echo "The bundle still points at localhost."
            exit 1
          fi
          if grep -rq "awsapprunner.com" dist/assets; then
            echo "The bundle calls App Runner directly. Session cookies would not be sent."
            exit 1
          fi
          echo "Bundle is same-origin."

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: smogwise-deploy-frontend

      # Content-hashed assets first, with a long cache life. Uploading these
      # before index.html means the new entry point never references an asset
      # that is not yet in the bucket.
      - name: Upload hashed assets
        working-directory: frontend
        run: |
          aws s3 sync dist "s3://$FRONTEND_BUCKET" \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress

      # The entry point last, and never cached, so a deployment takes effect
      # immediately instead of serving a stale bundle.
      - name: Upload the entry point
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      # Remove files that are no longer part of the build, after the new ones
      # are in place. The route shells published below are not in dist/, so
      # they are excluded or this would delete them on every deployment.
      - name: Remove orphaned files
        working-directory: frontend
        run: |
          EXCLUDES=()
          while read -r route; do
            [ -n "$route" ] && EXCLUDES+=(--exclude "$route")
          done < ../infrastructure/spa-routes.txt
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete "${EXCLUDES[@]}" --no-progress

      # Client-side routes are published as copies of the app shell, because
      # the distribution no longer maps 403 to /index.html. Those custom error
      # responses applied to every cache behaviour, so once the API shared the
      # distribution they rewrote its 403 and 404 responses into 200s carrying
      # HTML. The list is infrastructure/spa-routes.txt, and a backend test
      # fails if it drifts from frontend/src/App.tsx.
      - name: Publish the app shell at each client-side route
        working-directory: frontend
        run: |
          while read -r route; do
            [ -z "$route" ] && continue
            aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/$route" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "text/html; charset=utf-8" \
              --no-progress
          done < ../infrastructure/spa-routes.txt

      - name: Invalidate the CloudFront cache
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$ID"
          echo "Invalidation complete."

      - name: Smoke test the deployed site
        run: |
          DOMAIN=$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query 'Distribution.DomainName' --output text)
          echo "Checking https://$DOMAIN"
          curl -fsS --retry 5 --retry-delay 5 "https://$DOMAIN" > /dev/null
          echo "Checking the single-page-app fallback on a client route"
          curl -fsS --retry 3 --retry-delay 5 "https://$DOMAIN/dashboard" > /dev/null
          echo "Site responded on both paths."
